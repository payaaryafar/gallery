<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gallery</title>

    <link
      rel="stylesheet"
      href="https://unicons.iconscout.com/release/v4.0.0/css/line.css"
    />

    <link rel="stylesheet" href="style.css" />

    <script type="module" src="script.js"></script>
  </head>

  <body>
    <div class="lightBox">
      <div class="wrapper">
        <header>
          <div class="photographer">
            <i class="uil uil-camera"></i>

            <span class="photohapher1"> Paya Aryafar </span>
          </div>

          <div class="buttons">
            <i class="uil uil-import"></i>

            <i class="uil uil-times"></i>
          </div>
        </header>

        <div class="preview-img">
          <div class="img">
            <img class="lightBox__img" src="/images/img-3.jpg" alt="" />
          </div>
        </div>
      </div>
    </div>

    <section class="search">
      <img src="images/search-img.jpg" alt="search-img" />

      <div class="content">
        <h1>Image Gallery with JS</h1>

        <p>Search and download any images within a second</p>

        <div class="search__box">
          <i class="uil uil-search search__icon"></i>

          <input
            class="search__Input"
            type="text"
            placeholder="Search images"
          />
        </div>
      </div>
    </section>

    <section class="gallery">
      <ul class="images"></ul>

      <button class="gallery__load">Load More ...</button>
    </section>
  </body>
</html>
